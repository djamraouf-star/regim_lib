# Surcharges EURUSD uniquement ; les autres valeurs viennent de default.yaml.
# Exemple pour certains indicateurs ; aucune calibration imposée par l'API.
nom: eurusd
type: forex_majeur
description: "Paramètres EURUSD : ATR, ER, ADX et Shannon (M1, M5, M15, H1) calibrés sur 2024 ; exemples ADX (autres TF) et Shannon."

methodes:
  atr_volatility:
    timeframes:
      # Calibré sur 2024 (ticks Dukascopy, Bid), critère de volatilité
      # globale : voir analyses/eurusd_m5_atr_volatility/RESULTATS.md.
      M5: {n_atr: 7, fenetre: 6000}
  er_kaufman:
    timeframes:
      # Règle d'adoption appliquée sur 2024, mais calibration non
      # informative (aucun candidat ne prédit l'efficience future) : voir
      # analyses/eurusd_m5_er_kaufman/RESULTATS.md.
      M5: {n_er: 20, fenetre: 6000}
  adx:
    seuil_range: 22.0
    seuil_tendance: 28.0
    timeframes:
      # Calibré sur 2024 (seuils = quantiles 40/60 de l'ADX(7)) ; effet
      # faible : voir analyses/eurusd_m5_adx/RESULTATS.md.
      M5: {n_adx: 7, seuil_range: 28.1, seuil_tendance: 34.6}
  shannon:
    # Surcharge générale prioritaire sur les fenêtres par timeframe des défauts.
    fenetre: 100
    seuil_ordonne: 0.3
    seuil_desordre: 0.7
    timeframes:
      # Seuils = quantiles 40/60 de H sur 2024 ; calibration non
      # informative : voir analyses/eurusd_m5_shannon/RESULTATS.md.
      M5: {fenetre: 400, n_bins: 10, seuil_ordonne: 0.56, seuil_desordre: 0.64}
      # M1, M15, H1 : même démarche, horizon de 12 barres, également non
      # informatifs : voir analyses/eurusd_{m1,m15,h1}_shannon/RESULTATS.md.
      M1: {fenetre: 400, n_bins: 5, seuil_ordonne: 0.56, seuil_desordre: 0.62}
      M15: {fenetre: 100, n_bins: 5, seuil_ordonne: 0.65, seuil_desordre: 0.72}
      H1: {fenetre: 100, n_bins: 5, seuil_ordonne: 0.60, seuil_desordre: 0.67}

segmentation:
  pen: 3.0
