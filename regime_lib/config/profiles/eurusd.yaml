# Surcharges EURUSD uniquement ; les autres valeurs viennent de default.yaml.
# Exemple pour certains indicateurs ; aucune calibration imposée par l'API.
nom: eurusd
type: forex_majeur
description: "Exemple de paramètres spécifiques à EURUSD pour ADX et Shannon."

methodes:
  adx:
    seuil_range: 22.0
    seuil_tendance: 28.0
  shannon:
    # Surcharge générale prioritaire sur les fenêtres par timeframe des défauts.
    fenetre: 100
    seuil_ordonne: 0.3
    seuil_desordre: 0.7

segmentation:
  pen: 3.0
